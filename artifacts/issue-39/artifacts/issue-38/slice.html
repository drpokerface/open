<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tracer Slice</title>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    background: #111;
  }
  #container {
    width: 100vw;
    max-width: 56.25vh;
    aspect-ratio: 9/16;
    background: #87CEEB;
    position: relative;
    overflow: hidden;
  }
  .cutaway-active #scene-main { display: none; }
  .cutaway-active #scene-cutaway { 
    display: block; 
    animation: flashIn 0.2s ease-out forwards;
  }
  @keyframes flashIn {
    0% { opacity: 0; transform: scale(1.2) rotate(-5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  
  #scene-cutaway { display: none; background: #FF9999; width: 100%; height: 100%; position: absolute; top:0; left:0; }
  #scene-main { width: 100%; height: 100%; position: absolute; top:0; left:0; }
  
  /* Triangle Character */
  #todd {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
  }
  .talking #todd-mouth {
    animation: mouthFlap 0.15s infinite alternate;
    transform-origin: 50% 50%;
  }
  @keyframes mouthFlap {
    0% { transform: scaleY(0.2); }
    100% { transform: scaleY(1.8); }
  }

  /* Cutaway Character */
  #sphere {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    animation: bounce 0.3s infinite alternate ease-in-out;
  }
  @keyframes bounce {
    0% { top: 30%; transform: translateX(-50%) scale(1); }
    100% { top: 25%; transform: translateX(-50%) scale(1.05); }
  }

  /* Subtitles */
  #subtitles {
    position: absolute;
    bottom: 8%;
    width: 90%;
    left: 5%;
    text-align: center;
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 3.5vh;
    color: white;
    text-transform: uppercase;
    -webkit-text-stroke: 1.5px black;
    text-shadow: 3px 3px 0px #000;
    pointer-events: none;
  }
  
  /* Start button */
  #start {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3vh;
    padding: 15px 30px;
    z-index: 100;
    cursor: pointer;
    background: #ffcc00;
    border: 3px solid black;
    font-weight: bold;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="container">
  <button id="start">PLAY SCENE</button>
  
  <div id="scene-main">
    <svg id="todd" width="250" height="250" viewBox="0 0 100 100">
      <!-- Triangle -->
      <polygon points="50,10 90,90 10,90" fill="#32CD32" stroke="black" stroke-width="3"/>
      <!-- Eyes -->
      <circle cx="40" cy="50" r="6" fill="white" stroke="black" stroke-width="1.5"/>
      <circle cx="60" cy="50" r="6" fill="white" stroke="black" stroke-width="1.5"/>
      <!-- Pupils -->
      <circle cx="40" cy="50" r="2" fill="black" />
      <circle cx="60" cy="50" r="2" fill="black" />
      <!-- Unimpressed Eyebrows -->
      <line x1="32" y1="42" x2="48" y2="46" stroke="black" stroke-width="2"/>
      <line x1="52" y1="46" x2="68" y2="42" stroke="black" stroke-width="2"/>
      <!-- Mouth -->
      <rect id="todd-mouth" x="40" y="70" width="20" height="4" fill="black" />
    </svg>
  </div>
  
  <div id="scene-cutaway">
    <svg id="sphere" width="250" height="250" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#FF4500" stroke="black" stroke-width="3"/>
      <!-- VR Headset -->
      <rect x="15" y="35" width="70" height="25" fill="#333" stroke="black" stroke-width="2"/>
      <circle cx="35" cy="47" r="5" fill="#00FFCC"/>
      <circle cx="65" cy="47" r="5" fill="#00FFCC"/>
      <!-- Happy Mouth -->
      <path d="M 35 70 Q 50 85 65 70" fill="none" stroke="black" stroke-width="3"/>
    </svg>
  </div>
  
  <div id="subtitles"></div>
</div>

<script>
  const scriptData = [
    { text: "Corporate just mandated 'shape-positivity' training.", time: 2800 },
    { text: "If one more privileged circle tells me to 'smooth my edges'...", time: 3200 },
    { text: "I'm going to commit a hate crime against round geometry.", time: 3500 },
    { text: "Like that time I visited the Silicon Valley Sphere Retreat.", time: 3500, triggerCutaway: true },
    { text: "I'M DISRUPTING CORNERS! SYNERGY!", time: 3000, cutaway: true, rate: 1.4, pitch: 1.8 },
    { text: "Yeah, and you're also completely pointless, Carl.", time: 3500, cutaway: false, rate: 1.1, pitch: 0.8 }
  ];

  const subEl = document.getElementById('subtitles');
  const startBtn = document.getElementById('start');
  const container = document.getElementById('container');
  const mainScene = document.getElementById('scene-main');

  startBtn.addEventListener('click', () => {
    startBtn.style.display = 'none';
    playScene();
  });

  function playScene() {
    let currentLine = 0;

    function speakNext() {
      if (currentLine >= scriptData.length) {
        subEl.innerText = "";
        return;
      }

      const line = scriptData[currentLine];
      
      subEl.innerText = line.text;
      
      if (line.triggerCutaway || line.cutaway) {
        container.classList.add('cutaway-active');
      } else {
        container.classList.remove('cutaway-active');
      }
      
      const utterance = new SpeechSynthesisUtterance(line.text);
      utterance.rate = line.rate || 1.1;
      utterance.pitch = line.pitch || 0.8;
      
      utterance.onboundary = (event) => {
        if (event.name === 'word') {
          subEl.setAttribute('data-sync-index', event.charIndex);
        }
      };

      utterance.onstart = () => {
        if (!line.cutaway) mainScene.classList.add('talking');
      };

      utterance.onend = () => {
        mainScene.classList.remove('talking');
        currentLine++;
        setTimeout(speakNext, 100);
      };

      window.speechSynthesis.speak(utterance);
    }
    
    speakNext();
  }
</script>
</body>
</html>
