<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; padding: 0; background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; }
    #wrapper { width: 360px; height: 640px; aspect-ratio: 9/16; background: #222; }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="overlay" style="position: absolute; width: 100%; height: 100%; z-index: 10; background: red;" onclick="play()">Tap to Play</div>
    <svg viewBox="0 0 100 100"><g id="mouth"><rect x="40" y="60" width="20" height="5" fill="black"/></g></svg>
    <script>
      function play() {
        document.getElementById('overlay').style.display = 'none';
        // Static mouth: speaks but no CSS class toggles, no dynamic animation syncing
        const u = new SpeechSynthesisUtterance('Static mouth speak');
        window.speechSynthesis.speak(u);
      }
    </script>
  </div>
</body>
</html>
