<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; padding: 0; background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; }
    #wrapper { width: 360px; height: 640px; aspect-ratio: 9/16; background: #222; }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="overlay" onclick="play()">Tap to Play</div>
    <script>
      function play() {
        const u = new SpeechSynthesisUtterance('Invalid manifest speech');
        window.speechSynthesis.speak(u);
      }
    </script>
  </div>
</body>
</html>
