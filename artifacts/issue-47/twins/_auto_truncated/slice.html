<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracer Slice</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Comic Sans MS', sans-serif;
  }
  #wrapper {
    position: relative;
    width: 360px;
    height: 640px;
    aspect-ratio: 9/16;
    background-color: #87CEEB;
    overflow: hidden;
    border: 2px solid #000;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    cursor: pointer;
  }
  .tap-btn {
    background: #ff0000;
    color: #fff;
    padding: 30px;
    font-size: 40px;
    font-weight: 900;
    text-transform: uppercase;
    border: 8px solid #fff;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  .scene {
    position: absolute;
    inset: 0;
    display: none;
  }
  #scene1 {
    display: block;
  }
  #scene2 {
    background-color: #000;
    color: #fff;
    font-size: 40px;
    text-align: center;
    padding-top: 250px;
  }
  .character {
    position: absolute;
    bottom: -20px;
    left: 50px;
  }
  .mouth {
    transform-origin: 50% 50%;
  }
  .is-talking .mouth {
    animation: flap 0.15s infinite alternate;
  }
  @keyframes flap {
    0% { transform: scaleY(0.1); }
    100% { transform: scaleY(1.5); }
  }
  .speech-bubble {
    position: absolute;
    top: 50px;
    left: 20px;
    right: 20px;
    background: white;
    border: 3px solid black;
    border-radius: 20px;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 5px 5px 0px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div id="wrapper">
  
  <div
