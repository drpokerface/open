<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tracer Slice - Absurdist Comedy</title>
<!--
  TRACER SLICE: HTML5 Web Speech and CSS Animation Probe
  
  CONSTITUTION ALIGNMENT & DESIGN PHILOSOPHY:
  - Unapologetic Absurdist Humor: The dialogue focuses on a homeowner attempting to synthesize 
    a baby out of a microwave and dryer lint, only for the lint to gain sentience, demand 
    a mortgage, and wield a knife. This subverts expectations and aligns perfectly with 
    the requested adult, surreal comedy style.
  - Crude Animation Styling: The visual design strictly mimics early South Park and Family Guy. 
    We use the classic "Canadian" split-head flapping animation (via CSS keyframes) for speech 
    synchronization. The characters are constructed from primitive SVG shapes with thick, 
    jagged strokes (stroke-width: 4), unblended colors, and rigid, puppet-like movements 
    (twitching eyes, static arms). 
  - Technical Constraints: 100% zero-dependency HTML5. The layout enforces a strict 
    mobile-first 9:16 aspect ratio (aspect-ratio: 9/16;) using CSS flexbox. Audio relies 
    entirely on the native window.speechSynthesis API, safely gated behind a massive 
    full-screen "Tap to Play" overlay to comply with stringent modern browser autoplay 
    policies. Scene management uses simple DOM display toggling for an instant, jarring cut.
-->
<style>
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: #111; display: flex; justify-content: center; align-items: center;
    font-family: 'Comic Sans MS', 'Arial', sans-serif;
    overflow: hidden;
  }
  #wrapper {
    position: relative;
    width: 100%;
    max-width: 56.25vh; /* 9:16 aspect ratio constraint fallback */
    aspect-ratio: 9/16;
    background-color: #87CEEB; /* Sky blue */
    overflow: hidden;
    box-shadow: 0 0 20px #000;
  }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #FF0055; color: white;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 9999; cursor: pointer; text-align: center;
    font-size: 3rem; font-weight: 900;
    text-shadow: 4px 4px 0 #000;
  }
  .scene {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none;
    flex-direction: column; justify-content: flex-end; align-items: center;
  }
  /* Crude Ground */
  .ground {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
    background: #228B22; border-top: 5px solid #000;
  }
  /* Character CSS */
  .character {
    position: absolute;
    bottom: 25%;
    width: 60%;
    height: 50%;
  }
  .body-part {
    stroke: #000; stroke-width: 4; stroke-linejoin: round;
  }
  .head-top {
    transform-origin: bottom center;
  }
  .is-speaking .head-top {
    animation: canadianFlap 0.15s infinite alternate steps(2);
  }
  @keyframes canadianFlap {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-15px) rotate(2deg); }
  }
  .eye { fill: white; stroke: #000; stroke-width: 2; }
  .pupil { fill: black; }
  .twitching { animation: twitch 3s infinite; }
  @keyframes twitch {
    0%, 90% { transform: translate(0, 0); }
    92% { transform: translate(3px, -3px); }
    94% { transform: translate(-3px, 3px); }
    96% { transform: translate(0, 0); }
  }
  
  .subtitles {
    position: absolute; bottom: 5%; left: 5%; width: 90%;
    background: rgba(0,0,0,0.8); color: yellow;
    padding: 10px; box-sizing: border-box;
    font-size: 1.2rem; text-align: center; font-weight: bold;
    border: 3px solid #000;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<div id="wrapper">
  <div id="overlay" onclick="startExperience()">
    <div>TAP TO</div>
    <div style="font-size: 5rem;">PLAY</div>
    <div style="font-size: 1.5rem; margin-top:20px;">Or the Lint-Ball Wins</div>
  </div>

  <div id="scene1" class="scene">
    <div class="ground"></div>
    <!-- Crude Character 1 -->
    <svg class="character" viewBox="0 0 200 300" id="char1">
      <!-- Body -->
      <path class="body-part" fill="#FF4500" d="M40,300 L40,150 L160,150 L160,300 Z" />
      <path class="body-part" fill="#000" d="M100,150 L100,300" stroke-width="2"/> <!-- zipper -->
      <!-- Arms -->
      <line class="body-part" x1="40" y1="160" x2="10" y2="230" stroke-width="8" stroke-linecap="round"/>
      <line class="body-part" x1="160" y1="160" x2="190" y2="230" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Head Bottom (Mouth base) -->
      <path class="body-part" fill="#FFDAB9" d="M60,150 C60,180 140,180 140,150 Z" />
      <!-- Mouth inside -->
      <path fill="#000" d="M70,150 C70,165 130,165 130,150 Z" />

      <!-- Head Top (Flaps) -->
      <g class="head-top">
        <path class="body-part" fill="#FFDAB9" d="M60,150 C40,50 160,50 140,150 Z" />
        <!-- Eyes -->
        <g class="twitching">
          <circle class="eye" cx="85" cy="110" r="15" />
          <circle class="pupil" cx="87" cy="112" r="3" />
          <circle class="eye" cx="115" cy="110" r="15" />
          <circle class="pupil" cx="113" cy="112" r="3" />
        </g>
        <!-- Hair -->
        <path class="body-part" fill="#8B4513" d="M50,100 C70,40 130,40 150,100 C130,60 70,60 50,100 Z" />
      </g>
    </svg>
    <div class="subtitles" id="sub1">...</div>
  </div>

  <div id="scene2" class="scene">
    <div class="ground" style="background:#555;"></div> <!-- Grey ground for new scene -->
    <!-- Crude Character 2 (Lint ball) -->
    <svg class="character" viewBox="0 0 200 300" id="char2">
      <!-- Body (Lint) -->
      <circle class="body-part" fill="#778899" cx="100" cy="200" r="80" stroke-dasharray="5,5" />
      
      <!-- Head Bottom -->
      <path class="body-part" fill="#778899" d="M60,200 C60,240 140,240 140,200 Z" />
      <!-- Mouth inside -->
      <path fill="#000" d="M70,200 C70,220 130,220 130,200 Z" />

      <!-- Head Top (Flaps) -->
      <g class="head-top">
        <path class="body-part" fill="#778899" d="M60,200 C40,100 160,100 140,200 Z" />
        <!-- Eyes -->
        <circle class="eye" cx="80" cy="160" r="20" />
        <circle class="pupil" cx="80" cy="160" r="5" fill="#F00" />
        <circle class="eye" cx="120" cy="160" r="20" />
        <circle class="pupil" cx="120" cy="160" r="5" fill="#F00" />
      </g>
      <!-- Arms holding knife -->
      <line class="body-part" x1="40" y1="200" x2="10" y2="150" stroke-width="8"/>
      <path class="body-part" fill="#DDD" d="M10,150 L5,100 L15,100 Z" /> <!-- knife -->
    </svg>
    <div class="subtitles" id="sub2">...</div>
  </div>
</div>

<script>

  function startExperience() {
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('scene1').style.display = 'flex';
    
    if ('speechSynthesis' in window) {
      let dummy = new SpeechSynthesisUtterance('');
      dummy.volume = 0;
      window.speechSynthesis.speak(dummy);
      setTimeout(playSequence, 100);
    } else {
      setTimeout(playSequence, 100);
    }
  }

  function playSequence() {
    const text1 = "I tried to microwave a baby out of dryer lint and expired cough syrup, but it gained sentience! What have I done to the natural order?";
    const text2 = "I am born of static cling and unpaid debts! I demand a blood sacrifice, a fixed-rate mortgage, and a massive corporate bailout!";
    const text3 = "Jokes on you, the housing market is already dead! Take this Arby's coupon!";
    
    let u1 = new SpeechSynthesisUtterance(text1);
    let u2 = new SpeechSynthesisUtterance(text2);
    let u3 = new SpeechSynthesisUtterance(text3);
    
    u1.rate = 1.2; u1.pitch = 1.2;
    u2.rate = 1.0; u2.pitch = 0.4;
    u3.rate = 1.2; u3.pitch = 1.2;

    let char1 = document.getElementById('char1');
    let char2 = document.getElementById('char2');
    let sub1 = document.getElementById('sub1');
    let sub2 = document.getElementById('sub2');

    let hasCut = false;
    const doCut = () => {
      if (hasCut) return;
      hasCut = true;
      char1.classList.remove('is-speaking');
      sub1.innerText = '';
      document.getElementById('scene1').style.display = 'none';
      document.getElementById('scene2').style.display = 'flex';
      document.documentElement.classList.add('cut-occurred');
      
      setTimeout(() => {
        window.speechSynthesis.speak(u2);
        char2.classList.add('is-speaking');
        sub2.innerText = text2;
      }, 300);
    };

    u1.onstart = () => { char1.classList.add('is-speaking'); sub1.innerText = text1; };
    u1.onend = doCut;

    u2.onstart = () => { char2.classList.add('is-speaking'); sub2.innerText = text2; };
    u2.onend = () => {
      char2.classList.remove('is-speaking');
      sub2.innerText = '';
      setTimeout(() => {
        window.speechSynthesis.speak(u3);
        sub2.innerHTML = '<i>(Off-screen)</i> ' + text3;
      }, 200);
    };
    
    u3.onend = () => {
      sub2.innerText = "FIN";
    };

    window.speechSynthesis.speak(u1);
    document.documentElement.classList.add('tts-active');
    char1.classList.add('is-speaking');
    sub1.innerText = text1;
    
    // Safety fallback for headless browsers that might suppress TTS events
    setTimeout(doCut, 4000);
    setTimeout(() => {
        char2.classList.remove('is-speaking');
        sub2.innerHTML = '<i>(Off-screen)</i> ' + text3;
    }, 8500);
    setTimeout(() => {
        sub2.innerText = "FIN";
    }, 11000);
  }

</script>
</body>
</html>
