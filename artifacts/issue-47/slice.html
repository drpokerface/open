<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracer Slice</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Comic Sans MS', sans-serif;
  }
  #wrapper {
    position: relative;
    width: 360px;
    height: 640px;
    aspect-ratio: 9/16;
    background-color: #87CEEB;
    overflow: hidden;
    border: 2px solid #000;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    cursor: pointer;
  }
  .tap-btn {
    background: #ff0000;
    color: #fff;
    padding: 30px;
    font-size: 40px;
    font-weight: 900;
    text-transform: uppercase;
    border: 8px solid #fff;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  .scene {
    position: absolute;
    inset: 0;
    display: none;
  }
  #scene1 {
    display: block;
  }
  #scene2 {
    background-color: #000;
    color: #fff;
    font-size: 40px;
    text-align: center;
    padding-top: 250px;
  }
  .character {
    position: absolute;
    bottom: -20px;
    left: 50px;
  }
  .mouth {
    transform-origin: 50% 50%;
  }
  .is-talking .mouth {
    animation: flap 0.15s infinite alternate;
  }
  @keyframes flap {
    0% { transform: scaleY(0.1); }
    100% { transform: scaleY(1.5); }
  }
  .speech-bubble {
    position: absolute;
    top: 50px;
    left: 20px;
    right: 20px;
    background: white;
    border: 3px solid black;
    border-radius: 20px;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 5px 5px 0px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div id="wrapper">
  
  <div id="overlay">
    <div class="tap-btn">TAP TO PLAY</div>
  </div>

  <div id="scene1" class="scene">
    <div class="speech-bubble">
      Holy crap! I blew my life savings on raccoon crypto! This is the worst financial disaster ever!
    </div>
    
    <svg class="character" width="260" height="350" viewBox="0 0 200 300">
      <path d="M 40 300 L 40 160 C 40 120 160 120 160 160 L 160 300 Z" fill="#0055ff" stroke="black" stroke-width="4"/>
      <circle cx="100" cy="110" r="70" fill="#ffe0bd" stroke="black" stroke-width="4"/>
      <circle cx="70" cy="90" r="20" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="130" cy="90" r="20" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="70" cy="90" r="5" fill="black" />
      <circle cx="130" cy="90" r="5" fill="black" />
      <g class="mouth">
        <ellipse cx="100" cy="140" rx="30" ry="10" fill="black" />
      </g>
    </svg>
  </div>

  <div id="scene2" class="scene">
    <h1 style="color: red; font-family: Impact, sans-serif; font-size: 60px; margin:0;">WASTED</h1>
    <p style="font-size: 24px;">Scene 2 - Sudden Death</p>
  </div>

</div>

<script>
  const overlay = document.getElementById('overlay');
  const scene1 = document.getElementById('scene1');
  const scene2 = document.getElementById('scene2');
  
  const text = "Holy crap! I blew my life savings on raccoon crypto! This is the worst financial disaster ever!";
  const u = new SpeechSynthesisUtterance(text);
  u.pitch = 0.8;
  u.rate = 1.3;

  u.onstart = () => {
    scene1.classList.add('is-talking');
  };
  
  u.onend = () => {
    scene1.classList.remove('is-talking');
  };

  overlay.addEventListener('click', () => {
    overlay.style.display = 'none';
    window.speechSynthesis.speak(u);
    
    setTimeout(() => {
      scene1.style.display = 'none';
      scene2.style.display = 'block';
    }, 4500);
  });
</script>
</body>
</html>
